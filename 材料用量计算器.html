<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>材料用量计算器</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    h1 {
      color: #333;
      text-align: center;
      margin-top: 3vh;
      width: 80vw;
    }

    #scaleFactorDiv {
      width: 80vw;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 2vh;
    }

    #tableContainer {
      width: 80vw;
      margin-top: 3vh;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    table,
    th,
    td {
      border: 1px solid #ccc;
    }

    th,
    td {
      padding: 1.5vh 1vw;
      text-align: center;
    }

    input {
      width: 90%;
      padding: 1vh 1vw;
      border: 1px solid #ccc;
      border-radius: 4px;
      transition: border-color 0.3s ease;
    }

    input:focus {
      border-color: #66afe9;
    }

    button {
      display: block;
      margin: 2vh auto;
      padding: 1vh 2vw;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

  .unit {
      margin-left: 0.5vw;
      cursor: pointer;
      text-decoration: underline;
      color: #007bff;
    }

    /* 媒体查询，针对小屏幕设备调整样式 */
    @media (max-width: 600px) {
      h1 {
        font-size: 3vw;
      }

      input {
        font-size: 3vw;
      }

      button {
        font-size: 3vw;
      }

      th,
      td {
        padding: 1vh 0.5vw;
      }
    }
  </style>
</head>

<body>
  <h1>材料用量计算器</h1>
  <div id="scaleFactorDiv">
    <label for="scaleFactor">份数:</label>
    <input type="number" id="scaleFactor" value="1">
  </div>
  <div id="tableContainer"></div>
  <button onclick="addRow()">添加材料行</button>
  <button onclick="calculateAll()">计算调整后用量</button>

  <script>
    // 存储表格行数据的数组
    let rows = [];
    // 存储单位的变量，初始为克
    let unit = '克';

    // 创建初始表格行
    function createRow() {
      const table = document.createElement('table');
      const row = document.createElement('tr');

      const nameCell = document.createElement('td');
      const amountCell = document.createElement('td');
      const adjustedCell = document.createElement('td');

      const nameInput = document.createElement('input');
      const amountInput = document.createElement('input');
      const adjustedInput = document.createElement('input');
      const amountUnit = document.createElement('span');
      const adjustedUnit = document.createElement('span');

      nameInput.placeholder = '材料名称';
      amountInput.placeholder = '用量';
      amountInput.type = 'number';
      adjustedInput.placeholder = '调整后用量';
      adjustedInput.type = 'number';
      amountUnit.textContent = unit;
      adjustedUnit.textContent = unit;
      amountUnit.classList.add('unit');
      adjustedUnit.classList.add('unit');

      // 点击用量单位切换单位
      amountUnit.addEventListener('click', function () {
        toggleUnit(amountInput, amountUnit);
      });
      // 点击调整后用量单位切换单位
      adjustedUnit.addEventListener('click', function () {
        toggleUnit(adjustedInput, adjustedUnit);
      });

      nameCell.appendChild(nameInput);
      amountCell.appendChild(amountInput);
      amountCell.appendChild(amountUnit);
      adjustedCell.appendChild(adjustedInput);
      adjustedCell.appendChild(adjustedUnit);

      row.appendChild(nameCell);
      row.appendChild(amountCell);
      row.appendChild(adjustedCell);

      table.appendChild(row);

      // 将输入框和单位元素存储到行数据对象中
      const rowData = {
        nameInput: nameInput,
        amountInput: amountInput,
        adjustedInput: adjustedInput,
        amountUnit: amountUnit,
        adjustedUnit: adjustedUnit
      };

      // 将行数据对象添加到数组中
      rows.push(rowData);

      return table;
    }

    // 切换单位的函数
    function toggleUnit(input, unitSpan) {
      if (unit === '克') {
        unit = '千克';
        unitSpan.textContent = unit;
        input.value = (parseFloat(input.value) / 1000).toFixed(3);
      } else if (unit === '千克') {
        unit = '斤';
        unitSpan.textContent = unit;
        input.value = (parseFloat(input.value) * 2).toFixed(3);
      } else {
        unit = '克';
        unitSpan.textContent = unit;
        input.value = (parseFloat(input.value) * 500).toFixed(0);
      }
    }

    // 计算所有行的调整后用量并显示，同时设置调整后用量输入框的事件监听器
    function calculateAll() {
      const scaleFactor = parseFloat(document.getElementById('scaleFactor').value) || 1;
      rows.forEach(row => {
        let amount = parseFloat(row.amountInput.value) || 0;
        let adjusted = parseFloat(row.adjustedInput.value) || 0;

        // 当单位不一致时进行换算
        if (row.amountUnit.textContent!== row.adjustedUnit.textContent) {
          if (row.amountUnit.textContent === '克') {
            if (row.adjustedUnit.textContent === '千克') {
              amount /= 1000;
            } else if (row.adjustedUnit.textContent === '斤') {
              amount /= 500;
            }
          } else if (row.amountUnit.textContent === '千克') {
            if (row.adjustedUnit.textContent === '克') {
              amount *= 1000;
            } else if (row.adjustedUnit.textContent === '斤') {
              amount *= 2;
            }
          } else if (row.amountUnit.textContent === '斤') {
            if (row.adjustedUnit.textContent === '克') {
              amount *= 500;
            } else if (row.adjustedUnit.textContent === '千克') {
              amount /= 2;
            }
          }
        }

        row.adjustedInput.value = (amount * scaleFactor).toFixed(3);
      });
    }

    // 根据调整后用量重新计算份数
    function recalculateScaleFactor(row) {
      let amount = parseFloat(row.amountInput.value) || 0;
      let adjusted = parseFloat(row.adjustedInput.value) || 0;

      // 当单位不一致时进行换算
      if (row.amountUnit.textContent!== row.adjustedUnit.textContent) {
        if (row.amountUnit.textContent === '克') {
          if (row.adjustedUnit.textContent === '千克') {
            amount /= 1000;
          } else if (row.adjustedUnit.textContent === '斤') {
            amount /= 500;
          }
        } else if (row.amountUnit.textContent === '千克') {
          if (row.adjustedUnit.textContent === '克') {
            amount *= 1000;
          } else if (row.adjustedUnit.textContent === '斤') {
            amount *= 2;
          }
        } else if (row.amountUnit.textContent === '斤') {
          if (row.adjustedUnit.textContent === '克') {
            amount *= 500;
          } else if (row.adjustedUnit.textContent === '千克') {
            amount /= 2;
          }
        }
      }

      if (amount!== 0) {
        const newScaleFactor = adjusted / amount;
        document.getElementById('scaleFactor').value = newScaleFactor;
      }
    }

    // 为所有已存在和新增的行的调整后用量输入框添加输入事件监听器
    function setupInputListeners() {
      rows.forEach(row => {
        row.adjustedInput.addEventListener('input', function () {
          recalculateScaleFactor(row);
        });
      });
    }

    // 添加新的表格行
    function addRow() {
      const table = document.getElementById('tableContainer');
      const newRow = createRow();
      table.appendChild(newRow);
      setupInputListeners();
    }

    // 初始化页面时创建八行表格，并添加输入事件监听器
    window.onload = function () {
      const table = document.getElementById('tableContainer');
      for (let i = 0; i < 8; i++) {
        const initialRow = createRow();
        table.appendChild(initialRow);
      }
      setupInputListeners();
    }
  </script>
</body>

</html>
